name: Package Test Artifacts

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  package-test-artifacts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Package Test_Tk_Tests folder
      run: |
        # Create a zip archive of the Test_Tk_Tests folder
        cd Test_Tk_Tests
        zip -r ../Test_Toolkit_Tests.zip .
        cd ..
        echo "Created Test_Toolkit_Tests.zip with contents:"
        unzip -l Test_Toolkit_Tests.zip | head -20
        
    - name: Upload Test Toolkit Tests artifact
      uses: actions/upload-artifact@v4
      with:
        name: Test_Toolkit_Tests
        path: Test_Toolkit_Tests.zip
        retention-days: 30
        compression-level: 6
